# Generates the contribution-snake animation.
#
# WHERE THIS GOES
#   In the VISHWAJITHA28/VISHWAJITHA28 repo, at:
#     .github/workflows/snake.yml
#
# WHAT IT DOES
#   Reads your public contribution graph, renders it as an SVG of a snake
#   eating the squares, and pushes the result to a branch called `output`.
#   The README then points at that branch's raw file — which is why the image
#   URL contains /output/ rather than /main/.
#
# FIRST RUN
#   It runs every 12 hours, but nothing appears until the first run finishes.
#   To see it immediately: repo → Actions → "Generate snake animation" →
#   Run workflow. Give it about a minute, then hard-refresh your profile.
#
# IF THE IMAGE STAYS BROKEN
#   Check Settings → Actions → General → Workflow permissions is set to
#   "Read and write permissions". Without it the push to `output` fails and
#   the action goes red.

name: Generate snake animation

on:
  schedule:
    # Twice a day. More often than this just burns Actions minutes — the
    # graph does not change fast enough to notice.
    - cron: "0 */12 * * *"
  # Lets you trigger it by hand from the Actions tab, which you will want
  # for the very first run.
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate the SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: VISHWAJITHA28
          outputs: |
            dist/snake.svg?palette=github-light
            dist/snake-dark.svg?palette=github-dark

      - name: Push them to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
